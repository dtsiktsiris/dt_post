[project]
name = "dt-post"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dimitrios Tsiktsiris", email = "dtsiktsiris@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyside6>=6.11.2",
    "python-jsonpath==2.2.1",
    "requests==2.34.2",
]

[project.scripts]
dt-post = "dt_post.main:main"
dt-post-ui = "dt_post_ui.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]
